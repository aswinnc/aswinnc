<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="100%" height="90">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0b1120"/>
    <stop offset="55%" stop-color="#131a36"/>
    <stop offset="100%" stop-color="#0b1120"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="420" y1="0" x2="480" y2="0">
    <stop offset="0%" stop-color="#d946ef"/>
    <stop offset="50%" stop-color="#8b5cf6"/>
    <stop offset="100%" stop-color="#06b6d4"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-30 0; 30 0; -30 0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="mono" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#d946ef"/>
    <stop offset="50%" stop-color="#8b5cf6"/>
    <stop offset="100%" stop-color="#06b6d4"/>
  </linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
  </pattern>
  <clipPath id="frame"><rect x="1" y="1" width="898" height="88" rx="14"/></clipPath>
</defs>
<rect x="0" y="0" width="900" height="90" rx="14" fill="url(#bg)"/>
<g clip-path="url(#frame)">
<rect x="450" y="0" width="450" height="90" fill="url(#grid)"/>
<rect x="450" y="0" width="140" height="90" fill="url(#bg)" opacity="0.9"/>
<g transform="translate(832 45)">
<circle r="30" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
<circle r="22" fill="none" stroke="url(#mono)" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 6" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="80s" repeatCount="indefinite"/></circle>
<text x="0" y="5" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="-0.5" fill="url(#mono)" fill-opacity="0.07" stroke="url(#mono)" stroke-opacity="0.75" stroke-width="0.7">NC</text>
</g>
<rect x="420" y="20" width="60" height="3" rx="1.5" fill="url(#accent)"/>
<text x="450" y="50" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="5" fill="#e2e8f0">ASWIN N C</text>
<text x="450" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="600" font-size="9" letter-spacing="3" fill="#64748b">SOFTWARE DEVELOPER  ·  ORBITZ IT SOLUTION</text>
</g>
<rect x="0.5" y="0.5" width="899" height="89" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
<rect x="120" y="0.5" width="660" height="1" fill="url(#edge)"/>
</svg>
